# Copy this file to config.yaml and fill in real values.
# config.yaml is gitignored — config.example.yaml is the tracked template.

study_area:
  name: "TODO: e.g. Circle-Kaneshie corridor"
  # Bounding box in (south, west, north, east) — decimal degrees
  bbox: [5.55, -0.25, 5.60, -0.18]

data_sources:
  osm:
    network_type: "drive"   # passed to osmnx.graph_from_bbox
  dem:
    provider: "opentopography"
    demtype: "COP30"  # or "SRTMGL1"
  rainfall:
    provider: "open-meteo"  # Open-Meteo Historical Weather API (free, no key)
    start_date: "2015-01-01"
    end_date: null  # null = default to yesterday (Open-Meteo requires end_date)
  traffic:
    provider: "mapbox"
    mapbox_access_token: "TODO"  # set in .env or here
    profile: "driving-traffic"  # or "driving-traffic" or "walking"
    sample_interval_minutes: 60
    sample_days: 14
    max_requests_per_day: 300

env:
  max_episode_steps: 200
  flood_penalty: 50          # minutes-equivalent penalty for hitting a flooded edge
  step_penalty: 0.1          # small per-step penalty to discourage wandering
  reveal_radius_hops: 1      # how many hops ahead the agent can "see" conditions

training:
  dqn:
    total_timesteps: 200000
  ppo:
    total_timesteps: 1000000
    n_envs: 4

evaluation:
  num_scenarios: 100
  seed: 42
